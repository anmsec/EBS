<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EBS Inventory System</title>
<style>
:root{--p:#6d4aff;--pl:#efeaff;--bg:#f5f5f8;--t:#1f2230;--m:#6b7080;--b:#e4e5ec;--g:#16a34a;--a:#d97706;--r:#dc2626}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;font:14px/1.45 system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--t)}
#app{display:flex;min-height:100vh}
aside{width:210px;background:#fff;border-right:1px solid var(--b);padding:16px 10px;flex:none}

nav a{display:block;padding:9px 12px;border-radius:8px;cursor:pointer;margin-bottom:2px}

table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid var(--b);text-align:left}
th{color:var(--m);font-size:12px}.r{text-align:right}.w{overflow-x:auto}
input,select,button{font:inherit;padding:8px 10px;border:1px solid var(--b);border-radius:8px;background:#fff;max-width:100%}
button{cursor:pointer}button.p{background:var(--p);color:#fff;border-color:var(--p)}button:disabled{opacity:.5}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.f label{display:flex;flex-direction:column;gap:4px;color:var(--m);font-size:12px}
.tag{padding:2px 8px;border-radius:99px;font-size:12px;background:#eee}
.ok{background:#dcfce7;color:var(--g)}.lo{background:#fef3c7;color:var(--a)}.no{background:#fee2e2;color:var(--r)}
#login{max-width:360px;margin:8vh auto;padding:0 16px}#login .card{display:flex;flex-direction:column;gap:10px}
#lerr{color:var(--r)}#print{display:none;padding:20px}
@media print{#app,#login{display:none!important}#print{display:block}}
@media(max-width:800px){#app{flex-direction:column}aside{width:auto;display:flex;flex-wrap:wrap;align-items:center;gap:6px}aside h1{margin:0}nav{display:flex;flex-wrap:wrap}#main{padding:12px}}
#md{position:fixed;inset:0;background:#0008;display:none;justify-content:center;align-items:flex-start;overflow:auto;padding:16px;z-index:50}#md.on{display:flex}
.mbox{background:#fff;width:min(940px,100%);border-radius:6px;padding:16px}
.mh{flex:0 1 55%;color:#fff;text-align:center;font:700 24px/1 system-ui;letter-spacing:1px;padding:12px}.mh.s{background:#674ea7}.mh.r{background:#6aa84f}
.sec{background:#b7b7b7;font-weight:700;letter-spacing:3px;padding:4px 8px;margin:6px 0 8px;width:min(340px,100%)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:10px}.f2 label{display:flex;gap:8px;align-items:center;margin-bottom:4px;font-size:12px}.f2 label input,.f2 label select{flex:1;min-width:0}
.mt th{color:#fff;text-align:center;border:1px solid #bbb}.mt.s th{background:#8e7cc3}.mt.r th{background:#93c47d}.mt th.g{background:#93c47d}
.mt td{padding:0;border:1px solid #bbb}.mt input,.mt select{width:100%;border:0;border-radius:0}
@media(max-width:700px){.f2{grid-template-columns:1fr}}
</style></head><body>
<div id="login" hidden><div class="card"><h1 style="margin:0;color:var(--p)">EBS Inventory</h1>
<button id="gbtn" class="p">Sign in with Google (Admin)</button><hr style="width:100%;border:0;border-top:1px solid var(--b)">
<form id="lform" style="display:flex;flex-direction:column;gap:10px"><input id="em" type="email" placeholder="Encoder email" required><input id="pw" type="password" placeholder="Password" required><button>Sign in (Encoder)</button></form>
<div id="lerr"></div></div></div>
<div id="app" hidden>
<aside><h1>EBS</h1><nav>
<a data-p="dash" onclick="go('dash')">Dashboard</a><a data-p="prod" onclick="go('prod')">Products</a><a data-p="sales" onclick="go('sales')">Sales Records</a>
<a data-p="recv" onclick="go('recv')">Receivables</a><a data-p="borrow" onclick="go('borrow')">Borrowed</a><a data-p="prices" onclick="go('prices')">Price History</a>
<a data-p="count" onclick="go('count')">Physical Count</a><a data-p="reports" onclick="go('reports')">Reports</a><a data-p="ledger" onclick="go('ledger')">Stock Ledger</a>
<a data-p="conflicts" onclick="go('conflicts')">Sync Conflicts</a><a data-p="audit" onclick="go('audit')">Audit Log</a><a id="nu" data-p="users" onclick="go('users')" hidden>Users</a></nav></aside>
<section><header><span id="net"></span><span><span id="who"></span> <button onclick="auth.signOut().then(()=>location.reload())">Sign out</button></span></header>
<div id="main"></div></section></div>
<div id="md"></div>
<div id="print"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const cfg={apiKey:"AIzaSyD8Vfw0CDKZ-r3JFzg44JNmkdzYqSG4_pk",authDomain:"tonstudio-8344c.firebaseapp.com",databaseURL:"https://tonstudio-8344c-default-rtdb.firebaseio.com",projectId:"tonstudio-8344c",storageBucket:"tonstudio-8344c.firebasestorage.app",messagingSenderId:"825040472434",appId:"1:825040472434:web:2757362c6761be5bdd35eb"};
firebase.initializeApp(cfg);
const auth=firebase.auth(),fs=firebase.firestore(),TS=firebase.firestore.FieldValue.serverTimestamp(),inc=firebase.firestore.FieldValue.increment;
fs.enablePersistence({synchronizeTabs:true}).catch(()=>{}); // offline cache + durable write queue (IndexedDB)
const $=s=>document.querySelector(s),C=n=>fs.collection(n),nid=n=>fs.collection(n).doc();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const peso=c=>'₱'+(c/100).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2});
const toC=v=>Math.round(parseFloat(v||0)*100),pe=c=>(c/100).toFixed(2);
const today=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Manila'});
const dk=s=>s.toUpperCase().replace(/[\/\s]/g,'_');
const MODES=['Cash','Check','Charge','Borrow','Lost'];
let me,P={},U={},Q={},D=[],cur='dash',started=false,R=[],unsub=null,PEND=0;
const stk=i=>P[i]?.stock||0;

/* ---------- auth ---------- */
const showLogin=()=>{$('#login').hidden=false;$('#app').hidden=true;$('#lerr').textContent=sessionStorage.m||'';sessionStorage.removeItem('m')};
const deny=m=>{sessionStorage.m=m;auth.signOut().then(()=>location.reload())};
$('#gbtn').onclick=()=>auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e=>$('#lerr').textContent=e.message);
$('#lform').onsubmit=e=>{e.preventDefault();auth.signInWithEmailAndPassword($('#em').value,$('#pw').value).catch(()=>$('#lerr').textContent='Invalid email or password.')};
auth.onAuthStateChanged(async u=>{
  if(!u)return showLogin();
  try{
    const s=await fs.doc('users/'+u.uid).get();
    if(s.exists){me={uid:u.uid,...s.data()};return me.active?start():deny('Naka-disable ang account na ito.')}
    const b=await fs.doc('meta/app').get();
    if(!b.exists){
      if(!confirm('Wala pang superadmin. Gawing superadmin ang account na ito?'))return deny('Cancelled.');
      const bt=fs.batch();bt.set(fs.doc('users/'+u.uid),{name:u.displayName||u.email,email:u.email||'',role:'superadmin',active:true,at:TS});bt.set(fs.doc('meta/app'),{bootstrapped:true});
      await bt.commit();return location.reload();
    }
    await fs.doc('requests/'+u.uid).set({email:u.email||'',name:u.displayName||'',at:TS});
    deny('Naipadala na ang access request. Hintayin ang approval ng superadmin.');
  }catch(e){deny('Error: '+e.message)}
});
function start(){
  $('#login').hidden=true;$('#app').hidden=false;$('#who').textContent=`${me.name} (${me.role})`;$('#nu').hidden=me.role!=='superadmin';
  if(started)return;started=true;
  C('products').onSnapshot(s=>{P={};s.forEach(d=>P[d.id]=d.data());soft()},()=>{});
  if(me.role==='superadmin'){C('users').onSnapshot(s=>{U={};s.forEach(d=>U[d.id]=d.data());soft()},()=>{});C('requests').onSnapshot(s=>{Q={};s.forEach(d=>Q[d.id]=d.data());soft()},()=>{})}
  net();go('dash');checkOutbox();
}
const net=()=>{const e=$('#net'),o=navigator.onLine;e.textContent=(o?'● Online':'● Offline — naka-save locally, magsi-sync pag may internet')+(PEND?` · ${PEND} pending sync`:'');e.style.color=o?'var(--g)':'var(--r)'};
addEventListener('online',()=>{net();if(me)checkOutbox()});addEventListener('offline',net);
const soft=()=>{if(cur!=='count'&&cur!=='reports')render()};

/* ---------- router + page-level queries (limits reads on Spark) ---------- */
const wk=()=>{const m=new Date(today()+'T00:00:00Z');m.setUTCDate(m.getUTCDate()-(m.getUTCDay()+6)%7);return[...Array(7)].map((_,i)=>new Date(m.getTime()+i*864e5).toISOString().slice(0,10))};
const LQ={dash:()=>{const w=wk();return C('sales').where('date','>=',w[0]).where('date','<=',w[6])},sales:()=>C('sales').orderBy('date','desc').limit(200),recv:()=>C('sales').where('open','==',true),borrow:()=>C('sales').where('borrowOpen','==',true),ledger:()=>C('movements').orderBy('at','desc').limit(200),prices:()=>C('priceHistory').orderBy('at','desc').limit(200),audit:()=>C('auditLogs').orderBy('at','desc').limit(200),conflicts:()=>me.role==='encoder'?C('syncConflicts').where('by','==',me.uid):C('syncConflicts').orderBy('at','desc').limit(100)};
const pages={dash,prod,sales,users,recv,borrow,count,reports,ledger,prices,conflicts,audit};
function go(p){
  if(p==='users'&&me.role!=='superadmin')p='dash';
  cur=p;if(unsub){unsub();unsub=null}D=[];PEND=0;
  if(LQ[p])unsub=LQ[p]().onSnapshot({includeMetadataChanges:true},s=>{D=s.docs.map(d=>({id:d.id,...d.data(),_p:d.metadata.hasPendingWrites}));PEND=D.filter(x=>x._p).length;net();soft()},()=>{});
  document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.p===p));render();
}
const render=()=>{$('#main').innerHTML=pages[cur]()};
const ids=()=>Object.keys(P).sort((a,b)=>P[a].name.localeCompare(P[b].name));
const status=id=>{const s=stk(id);return s<0?['no','Negative']:s===0?['no','Out of stock']:s<=(P[id].restock||0)?['lo','Low stock']:['ok','In stock']};
const filt=()=>{const q=$('#q').value.toLowerCase();document.querySelectorAll('#tb tr').forEach(r=>r.hidden=!r.textContent.toLowerCase().includes(q))};
const aud=(bt,action,entity,eid,before,after,reason)=>bt.set(nid('auditLogs'),{action,entity,eid,before:before||null,after:after||null,reason:reason||'',by:me.uid,byName:me.name,role:me.role,at:TS});
const fmt=t=>t?.toDate?t.toDate().toLocaleString('en-PH',{timeZone:'Asia/Manila',dateStyle:'medium',timeStyle:'short'}):'pending';
const reportConflict=(m,e)=>fs.doc('syncConflicts/'+m.id).set({kind:m.col,label:m.label,payload:m.payload||'',error:e?(e.code==='permission-denied'?'Duplicate DR o walang permiso':e.message):'Hindi tinanggap ng server sa pag-sync',status:'OPEN',by:me.uid,byName:me.name,at:TS}).catch(()=>{});
async function checkOutbox(){ // offline writes the server rejected after a restart would otherwise vanish silently
  const mine=()=>JSON.parse(localStorage.ob||'[]').filter(x=>x.uid===me.uid);if(!mine().length||!navigator.onLine)return;
  try{await fs.waitForPendingWrites();for(const m of mine()){const d=await fs.doc(m.col+'/'+m.id).get({source:'server'});if(!d.exists)reportConflict(m,null)}
    localStorage.ob=JSON.stringify(JSON.parse(localStorage.ob||'[]').filter(x=>x.uid!==me.uid))}catch(e){}
}
async function send(bt,ok,meta){ // offline-safe commit: never claims "synced" before server confirms
  if(meta){const o=JSON.parse(localStorage.ob||'[]');o.push({...meta,uid:me.uid,at:Date.now()});localStorage.ob=JSON.stringify(o)}
  const done=()=>{if(meta)localStorage.ob=JSON.stringify(JSON.parse(localStorage.ob||'[]').filter(x=>x.id!==meta.id))};
  const p=bt.commit(),bad=e=>{done();if(meta)reportConflict(meta,e);alert('Na-reject ng server: '+(e.code==='permission-denied'?'DR number ay ginamit na, o walang permiso. Tingnan ang Sync Conflicts.':e.message))};
  p.then(done,()=>{});
  if(!navigator.onLine){p.catch(bad);alert('Naka-save offline; pending sync.');return true}
  try{await p;alert(ok);return true}catch(e){bad(e);return false}
}

/* ---------- dashboard ---------- */
function dash(){
  const w=wk(),d=today(),sm=(dt,m)=>D.filter(s=>!s.rev&&s.date===dt&&s.mode===m).reduce((a,s)=>a+s.total,0);
  const act=ids().filter(i=>P[i].active!==false),low=act.filter(i=>stk(i)<=(P[i].restock||0)),M3=['Cash','Check','Charge'],col=['#16a34a','#6d4aff','#d97706'];
  const c=[...M3.map(m=>[m,peso(sm(d,m))]),['Overall sales',peso(M3.reduce((a,m)=>a+sm(d,m),0))],['Borrow (count)',D.filter(s=>!s.rev&&s.date===d&&s.mode==='Borrow').length],['Lost (count)',D.filter(s=>!s.rev&&s.date===d&&s.mode==='Lost').length],['Items to restock',low.length],['Negative stock',act.filter(i=>stk(i)<0).length]];
  const by=w.map(x=>M3.map(m=>sm(x,m))),mx=Math.max(1,...by.flat());
  return `<h2>Dashboard <small>${d} · posted sale value; Lost/Borrow excluded</small></h2><div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap"><button style="background:#674ea7;color:#fff;border-color:#674ea7" onclick="openM('s')">+ Record Sales</button><button style="background:#6aa84f;color:#fff;border-color:#6aa84f" onclick="openM('r')">+ Record Stock</button></div><div class="grid">${c.map(([k,v])=>`<div class="card"><span>${k}</span><b>${v}</b></div>`).join('')}</div>
  <div class="card"><h3 style="margin-top:0">This week <small style="color:var(--m);font-weight:400">${M3.map((m,k)=>`<span style="color:${col[k]}">■</span> ${m}`).join(' ')}</small></h3><div style="display:flex;gap:8px">${w.map((x,i)=>`<div style="flex:1;text-align:center"><div style="display:flex;gap:2px;align-items:flex-end;height:130px;justify-content:center">${by[i].map((v,k)=>`<div title="${M3[k]} ${peso(v)}" style="width:14px;height:${Math.round(v/mx*130)}px;background:${col[k]}"></div>`).join('')}</div><small>${x.slice(5)}</small></div>`).join('')}</div></div>
  <div class="card w"><h3 style="margin-top:0">Restock list</h3><table><tr><th>Item<th>Stock<th>Level<th>Status</tr>${low.map(i=>`<tr><td>${esc(P[i].name)}<td>${stk(i)}<td>${P[i].restock||0}<td><span class="tag ${status(i)[0]}">${status(i)[1]}</span></tr>`).join('')||'<tr><td colspan=4>Walang low stock.</tr>'}</table></div>`;
}

/* ---------- products ---------- */
function prod(){
  return `<h2>Products</h2><div class="card"><form class="f" onsubmit="addProd(event)">
  <label>Name<input id="pn" required></label><label>SKU<input id="ps"></label><label>Unit<input id="pu" value="pc"></label>
  <label>Opening stock<input id="po" type="number" min="0" step="1" value="0"></label><label>Cost ₱<input id="pc" type="number" min="0" step="0.01" value="0"></label>
  <label>Price ₱<input id="pp" type="number" min="0" step="0.01" value="0"></label><label>Restock level<input id="pr" type="number" min="0" step="1" value="0"></label>
  <label>&nbsp;<button class="p">Add product</button></label></form></div>
  <div class="card w"><input id="q" placeholder="Search…" oninput="filt()" style="margin-bottom:8px"> <button onclick="expStock()">Export CSV</button> <button onclick="expTpl()">Download CSV template</button>${me.role!=='encoder'?` <button onclick="$('#imp').click()">Import CSV</button><input type="file" id="imp" accept=".csv,text/csv" hidden onchange="impFile(this)">`:''}${me.role!=='encoder'?' <button onclick="reconcile()">Reconcile stock</button>':''}<table><thead><tr><th>Item<th>SKU<th>Unit<th class="r">Stock<th class="r">Level<th class="r">Avg cost<th class="r">Price<th>Status<th></tr></thead>
  <tbody id="tb">${ids().map(i=>{const p=P[i],s=status(i);return `<tr><td>${esc(p.name)}<td>${esc(p.sku)}<td>${esc(p.unit)}<td class="r">${stk(i)}<td class="r">${p.restock||0}<td class="r">${peso(p.cost||0)}<td class="r">${peso(p.price||0)}<td><span class="tag ${s[0]}">${s[1]}</span><td><button onclick="editPrice('${i}')">Price</button> ${me.role!=='encoder'?`<button onclick="editCost('${i}')">Cost</button> `:''}<button onclick="phist('${i}')">History</button></tr>`}).join('')}</tbody></table></div>`;
}
async function addProd(e){
  e.preventDefault();const f=e.target,g=i=>$('#'+i).value.trim(),name=g('pn'),sku=g('ps'),all=Object.values(P);
  if(sku&&all.some(p=>(p.sku||'').toLowerCase()===sku.toLowerCase()))return alert('May product na gumagamit ng SKU na ito.');
  const d=all.find(p=>p.name.toLowerCase()===name.toLowerCase());
  if(d&&!confirm('May kapareho nang pangalan: '+d.name+'. Idagdag pa rin?'))return;
  const r=nid('products'),cost=toC(g('pc')),open=parseInt(g('po'))||0,bt=fs.batch();
  bt.set(r,{name,sku,unit:g('pu'),restock:parseInt(g('pr'))||0,price:toC(g('pp')),cost,stock:Math.max(0,open),active:true,by:me.uid,at:TS});
  const ph=(t,v)=>v>0&&bt.set(nid('priceHistory'),{pid:r.id,type:t,old:0,new:v,src:'Opening',by:me.uid,byName:me.name,at:TS});ph('COST',cost);ph('SELLING',toC(g('pp')));
  if(open>0)bt.set(nid('movements'),{pid:r.id,qty:open,type:'OPENING',ref:r.id,date:today(),by:me.uid,byName:me.name,cost,at:TS});
  if(await send(bt,'Na-add ang product.'))f.reset();
}
async function editPrice(id){
  const v=prompt('Bagong selling price ₱',pe(P[id].price));if(v===null)return;const n=toC(v);if(!(n>=0))return alert('Invalid price');if(n===P[id].price)return;
  const why=prompt('Reason (hal. supplier increase, promo)')||'',bt=fs.batch();
  bt.update(fs.doc('products/'+id),{price:n});bt.set(nid('priceHistory'),{pid:id,type:'SELLING',old:P[id].price,new:n,src:'Manual',reason:why,by:me.uid,byName:me.name,at:TS});
  aud(bt,'PRICE_CHANGE','products',id,{price:P[id].price},{price:n},why);send(bt,'Na-update ang price.');
}
async function editCost(id){
  const v=prompt('Bagong average cost ₱ (manual adjustment, hal. dagdag na gastos)',pe(P[id].cost||0));if(v===null)return;const n=toC(v);if(!(n>=0))return alert('Invalid cost');if(n===(P[id].cost||0))return;
  const why=prompt('Reason (kailangan)');if(!why)return;const bt=fs.batch();
  bt.update(fs.doc('products/'+id),{cost:n});bt.set(nid('priceHistory'),{pid:id,type:'COST',old:P[id].cost||0,new:n,src:'Manual',reason:why,by:me.uid,byName:me.name,at:TS});
  aud(bt,'COST_ADJUST','products',id,{cost:P[id].cost||0},{cost:n},why);send(bt,'Na-update ang cost.');
}
const phHead=nm=>`<thead><tr><th>Date${nm?'<th>Item':''}<th>Type<th class="r">Old<th class="r">New<th class="r">Change<th>Source<th>By</tr></thead>`;
const phRow=(h,nm)=>`<tr><td>${fmt(h.at)}${nm?`<td>${esc(P[h.pid]?.name)}`:''}<td>${h.type==='COST'?'Cost':'Selling'}<td class="r">${peso(h.old||0)}<td class="r">${peso(h.new)}<td class="r">${h.old?((h.new-h.old)/h.old*100).toFixed(1)+'%':'—'}<td>${h.src||(h.ref?'Restock':'Manual')}${h.reason?' · '+esc(h.reason):''}<td>${esc(h.byName)}</tr>`;
async function phist(id){
  K='h';$('#md').innerHTML=`<div class="mbox">${mh('s','PRICE HISTORY')}<h3>${esc(P[id].name)}</h3><div class="w" id="phb">Loading…</div></div>`;$('#md').classList.add('on');
  try{const s=await C('priceHistory').where('pid','==',id).get(),l=s.docs.map(d=>d.data()).sort((a,b)=>(b.at?.seconds??9e9)-(a.at?.seconds??9e9));
    $('#phb').innerHTML=`<table>${phHead(0)}<tbody>${l.map(h=>phRow(h,0)).join('')||'<tr><td colspan=7>Walang history.'}</tbody></table>`}catch(e){$('#phb').textContent=e.message}
}
const prices=()=>`<h2>Price History <small>pinakabagong 200 · cost at selling</small></h2><div class="card w"><input id="q" placeholder="Search item…" oninput="filt()" style="margin-bottom:8px"><table>${phHead(1)}<tbody id="tb">${D.map(h=>phRow(h,1)).join('')}</tbody></table></div>`;

/* ---------- line editor + entry modals ---------- */
let K=null;
const blank=n=>[...Array(n)].map(()=>({pid:'',qty:'',price:'',np:''})),mq=r=>parseInt(r.qty)||0;
const opts=v=>'<option value="">Select item</option>'+ids().filter(i=>P[i].active!==false).map(i=>`<option value="${i}" ${i===v?'selected':''}>${esc(P[i].name)}</option>`).join('');
const mh=(k,t)=>`<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px"><button onclick="closeM()">◀ Close</button><div class="mh ${k}">${t}</div></div>`;
function openM(k){K=k;R=blank(10);$('#md').innerHTML=k==='s'?saleForm():restForm();$('#md').classList.add('on');drawRows()}
function closeM(){K=null;$('#md').classList.remove('on');$('#md').innerHTML=''}
const clearM=()=>{if(confirm('I-clear ang form?'))openM(K)};
function drawRows(){
  const s=K==='s';
  $('#rows').innerHTML=R.map((r,i)=>`<tr><td style="width:80px"><input type="number" min="1" step="1" value="${r.qty}" oninput="setR(${i},'qty',this.value)">
  <td><select onchange="setR(${i},'pid',this.value)">${opts(r.pid)}</select>
  ${s?`<td class="r" style="width:110px">${r.pid?peso(P[r.pid].cost||0):''}<td style="width:110px"><input type="number" min="0" step="0.01" value="${r.price}" oninput="setR(${i},'price',this.value)">`
     :`<td style="width:110px"><input type="number" min="0" step="0.01" value="${r.price}" oninput="setR(${i},'price',this.value)"><td style="width:110px"><input type="number" min="0" step="0.01" value="${r.np||''}" oninput="setR(${i},'np',this.value)">`}
  <td class="r" style="width:110px" id="lt${i}">${s?'<td class="r" style="width:110px" id="rs'+i+'">':''}</tr>`).join('');
  tot();
}
function tot(){
  const s=K==='s';let t=0;
  R.forEach((r,i)=>{const v=toC(r.price)*mq(r);t+=v;$('#lt'+i).textContent=r.pid?peso(v):'';const e=$('#rs'+i);if(e){const x=r.pid?stk(r.pid)-mq(r):'';e.textContent=x;e.style.color=x<0?'var(--r)':''}});
  if(!s){$('#sub').textContent=peso(t);t+=toC($('#r_other').value)+toC($('#r_del').value)}
  $('#tot').textContent=peso(t);
}
function setR(i,k,v){R[i][k]=v;if(k==='pid'){if(v){R[i].price=pe(K==='s'?P[v].price:P[v].cost);if(!mq(R[i]))R[i].qty=1}drawRows()}else tot()}
const addR=()=>{R.push(...blank(5));drawRows()};
function saleForm(){
  return `<div class="mbox">${mh('s','SALES')}<div class="sec">SOLD TO :</div><div class="f2"><div>

  <label>Mode of payment<select id="s_mode">${MODES.map(m=>`<option>${m}</option>`).join('')}</select></label><label>DR Number<input id="s_dr"></label><label>PO Number<input id="s_po"></label><label>SI Number<input id="s_si"></label></div></div>

async function postSale(){
  const g=i=>$('#'+i).value.trim(),mode=g('s_mode'),dr=g('s_dr'),date=g('s_date')||today();
  const lines=R.filter(r=>r.pid).map(r=>({pid:r.pid,name:P[r.pid].name,qty:parseInt(r.qty),price:toC(r.price),cost:P[r.pid].cost||0}));
  if(!lines.length||lines.some(l=>!(l.qty>0)||!(l.price>=0)))return alert('Check items, qty at price.');
  if(new Set(lines.map(l=>l.pid)).size!==lines.length)return alert('May dobleng item. Pagsamahin sa isang line.');
  if(!g('s_cust'))return alert('Customer name ang kailangan.');
  if(mode!=='Lost'&&!dr)return alert('DR number ang kailangan.');
  if(mode==='Lost'&&!g('s_notes'))return alert('Reason sa Notes ang kailangan para sa Lost.');
  let negReason='';const neg=lines.filter(l=>l.qty>stk(l.pid));
  if(neg.length){negReason=prompt('Lalampas sa stock: '+neg.map(l=>l.name).join(', ')+'.\nReason para ituloy?')||'';if(!negReason)return}
  const total=lines.reduce((a,l)=>a+l.qty*l.price,0);
  if(!confirm(`I-post ang ${mode} na ${peso(total)}?`))return;
  const r=nid('sales'),type={Lost:'LOSS',Borrow:'BORROW_OUT'}[mode]||'SALE',bt=fs.batch(); // client-generated id = idempotent retry
  bt.set(r,{date,customer:g('s_cust'),account:g('s_acc'),mode,dr,po:g('s_po'),si:g('s_si'),notes:g('s_notes'),lines,total,negReason,paid:0,open:mode==='Charge',borrowOpen:mode==='Borrow',ret:{},by:me.uid,byName:me.name,at:TS});
  lines.forEach(l=>{bt.set(nid('movements'),{pid:l.pid,qty:-l.qty,type,ref:r.id,date,by:me.uid,byName:me.name,cost:l.cost,at:TS});bt.update(fs.doc('products/'+l.pid),{stock:inc(-l.qty)})});
  if(dr)bt.set(fs.doc('drIndex/'+dk(dr)),{sale:r.id});
  $('#pb').disabled=true;
  if(await send(bt,'Na-post.',{col:'sales',id:r.id,label:`Sale DR ${dr||'-'} · ${g('s_cust')} · ${peso(total)}`,payload:JSON.stringify({date,customer:g('s_cust'),account:g('s_acc'),mode,dr,po:g('s_po'),si:g('s_si'),notes:g('s_notes'),lines:lines.map(l=>({pid:l.pid,qty:l.qty,price:l.price}))})}))closeM();else $('#pb').disabled=false;
}

async function postRest(){
  const g=i=>$('#'+i).value.trim(),date=g('r_date')||today();
  const lines=R.filter(r=>r.pid).map(r=>({pid:r.pid,name:P[r.pid].name,qty:parseInt(r.qty),cost:toC(r.price),np:r.np?toC(r.np):null}));
  if(!lines.length||lines.some(l=>!(l.qty>0)||!(l.cost>=0)||(l.np!==null&&!(l.np>=0))))return alert('Check items, qty at cost.');
  if(new Set(lines.map(l=>l.pid)).size!==lines.length)return alert('May dobleng item. Pagsamahin sa isang line.');
  if(!g('r_sup'))return alert('Supplier ang kailangan.');
  const other=toC(g('r_other')),del=toC(g('r_del')),charges=other+del,sub=lines.reduce((a,l)=>a+l.qty*l.cost,0),total=sub+charges;
  if(!(charges>=0))return alert('Invalid charges.');
  let left=charges;lines.forEach((l,i)=>{l.alloc=i===lines.length-1?left:(sub?Math.round(charges*l.qty*l.cost/sub):0);left-=l.alloc});
  if(!confirm(`I-post ang restock na ${peso(total)}?`))return;
  const r=nid('restocks'),bt=fs.batch();
  lines.forEach(l=>{
    const landed=l.qty*l.cost+l.alloc,have=Math.max(0,stk(l.pid)),avg=Math.round((have*(P[l.pid].cost||0)+landed)/(have+l.qty));l.landedUnit=Math.round(landed/l.qty);
    bt.set(nid('movements'),{pid:l.pid,qty:l.qty,type:'RESTOCK',ref:r.id,date,by:me.uid,byName:me.name,cost:l.landedUnit,at:TS});
    const up={cost:avg,stock:inc(l.qty)};if(l.np!==null)up.price=l.np;bt.update(fs.doc('products/'+l.pid),up);
    bt.set(nid('priceHistory'),{pid:l.pid,type:'COST',old:P[l.pid].cost||0,new:avg,by:me.uid,byName:me.name,src:'Restock',ref:r.id,at:TS});
    if(l.np!==null)bt.set(nid('priceHistory'),{pid:l.pid,type:'SELLING',old:P[l.pid].price||0,new:l.np,by:me.uid,byName:me.name,src:'Restock',ref:r.id,at:TS});
  });
  bt.set(r,{date,supplier:g('r_sup'),ref:g('r_ref'),notes:g('r_notes'),lines,subtotal:sub,other,delivery:del,total,by:me.uid,byName:me.name,at:TS});
  $('#pb').disabled=true;
  if(await send(bt,'Na-post ang restock.',{col:'restocks',id:r.id,label:`Restock ${g('r_sup')} · ${peso(total)}`}))closeM();else $('#pb').disabled=false;
}

async function pay(id){
  const s=D.find(x=>x.id===id),b=s.total-s.paid-(s.adj||0),v=prompt(`Payment amount ₱ (balance ${peso(b)})`);if(v===null)return;

async function hist(id){const s=await C('payments').where('sale','==',id).get();alert(s.docs.map(d=>d.data()).sort((x,y)=>x.date<y.date?-1:1).map(p=>`${p.date}  ${peso(p.amount)}  ${p.method} ${p.ref||''}  (${p.byName})`).join('\n')||'Wala pang bayad.')}

async function retB(sid,pid){

  bt.set(nid('borrowReturns'),{sale:sid,pid,qty:v,date,by:me.uid,byName:me.name,at:TS});

  bt.update(fs.doc('products/'+pid),{stock:inc(v)});bt.update(fs.doc('sales/'+sid),{['ret.'+pid]:inc(v),borrowOpen:left>0});send(bt,'Na-record ang sauli.');
}
function csv(rows,name){
  const t='\ufeff'+rows.map(r=>r.map(c=>{if(typeof c!=='number'){c=String(c??'');if(/^[=+\-@]/.test(c))c="'"+c}c=String(c);return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c}).join(',')).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv;charset=utf-8'}));a.download=name+'-'+today()+'.csv';a.click();
}

function openRet(id){
  const s=D.find(x=>x.id===id);K='t';
  $('#md').innerHTML=`<div class="mbox">${mh('s','SALES RETURN')}<p>DR ${esc(s.dr)} · ${esc(s.customer)}</p><div class="w"><table class="mt s"><thead><tr><th>Item<th>Sold<th>Nai-return na<th>Return qty<th>Resalable</tr></thead><tbody>${s.lines.map((l,i)=>`<tr><td style="padding:6px">${esc(l.name)}<td class="r">${l.qty}<td class="r">${(s.rtn||{})[l.pid]||0}<td><input type="number" min="0" step="1" value="0" id="rq${i}"><td style="text-align:center"><input type="checkbox" id="rz${i}" checked style="width:auto"></tr>`).join('')}</tbody></table></div>

  $('#md').classList.add('on');

async function postRet(id){
  const s=D.find(x=>x.id===id),reason=$('#rt_reason').value.trim();
  const ls=s.lines.map((l,i)=>({...l,q:parseInt($('#rq'+i).value)||0,res:$('#rz'+i).checked})).filter(l=>l.q>0);
  if(!ls.length)return alert('Maglagay ng return qty.');if(!reason)return alert('Reason ang kailangan.');
  if(ls.some(l=>l.q>l.qty-((s.rtn||{})[l.pid]||0)))return alert('Lampas sa maibabalik na qty.');
  const amt=ls.reduce((a,l)=>a+l.q*l.price,0),cg=ls.filter(l=>l.res).reduce((a,l)=>a+l.q*l.cost,0),bt=fs.batch(),date=today(),r=nid('returns');
  bt.set(r,{sale:id,dr:s.dr,customer:s.customer,date,lines:ls.map(l=>({pid:l.pid,name:l.name,qty:l.q,price:l.price,cost:l.cost,resalable:l.res})),amount:amt,cogs:cg,reason,by:me.uid,byName:me.name,at:TS});
  const up={adj:inc(amt)};ls.forEach(l=>up['rtn.'+l.pid]=inc(l.q));
  if(s.mode==='Charge')up.open=(s.total-s.paid-(s.adj||0)-amt)>0;
  bt.update(fs.doc('sales/'+id),up);
  ls.filter(l=>l.res).forEach(l=>{bt.set(nid('movements'),{pid:l.pid,qty:l.q,type:'SALE_RETURN',ref:r.id,date,by:me.uid,byName:me.name,cost:l.cost,at:TS});bt.update(fs.doc('products/'+l.pid),{stock:inc(l.q)})});
  if(await send(bt,'Na-record ang return.',{col:'returns',id:r.id,label:`Return DR ${s.dr} · ${peso(amt)}`}))closeM();
}

/* ---------- physical count ---------- */
function count(){
  if(me.role==='encoder')return '<h2>Physical Count</h2><div class="card">Admin lang ang may access.</div>';
  return `<h2>Physical Count</h2><div class="card w"><p style="color:var(--m);margin-top:0">Ilagay ang aktwal na bilang. Ang pagkakaiba laban sa system stock (sa oras na binuksan ang page) ay ipo-post bilang adjustment sa ledger. Iwanang blangko ang hindi binilang.</p><table><thead><tr><th>Item<th class="r">System stock<th>Counted<th class="r">Variance<th class="r">Cost impact</tr></thead><tbody>${ids().map(i=>`<tr><td>${esc(P[i].name)}<td class="r">${stk(i)}<td><input type="number" step="1" id="c_${i}" data-s="${stk(i)}" oninput="cv('${i}')" style="width:100px"><td class="r" id="v_${i}"><td class="r" id="x_${i}"></tr>`).join('')}</tbody></table><p><input id="c_reason" placeholder="Reason / count notes" style="width:60%"> <button class="p" onclick="postCount()">Post adjustments</button></p></div>`;
}
function cv(i){const e=$('#c_'+i),v=e.value===''?null:parseInt(e.value)-parseInt(e.dataset.s);$('#v_'+i).textContent=v===null||isNaN(v)?'':v;$('#x_'+i).textContent=v?peso(v*(P[i].cost||0)):''}
async function postCount(){
  const reason=$('#c_reason').value.trim(),ls=ids().map(i=>{const e=$('#c_'+i);return e.value===''?null:{pid:i,name:P[i].name,sys:parseInt(e.dataset.s),counted:parseInt(e.value)}}).filter(Boolean);
  if(!ls.length)return alert('Walang bilang.');if(ls.some(l=>!(l.counted>=0)))return alert('Invalid count.');
  ls.forEach(l=>l.v=l.counted-l.sys);const df=ls.filter(l=>l.v);
  if(!df.length)return alert('Walang pagkakaiba.');if(!reason)return alert('Reason ang kailangan.');
  if(!confirm(`I-post ang ${df.length} adjustment?`))return;
  const bt=fs.batch(),date=today(),r=nid('stockCounts');
  bt.set(r,{date,reason,lines:ls,by:me.uid,byName:me.name,at:TS});
  df.forEach(l=>{bt.set(nid('movements'),{pid:l.pid,qty:l.v,type:'ADJUSTMENT',ref:r.id,date,by:me.uid,byName:me.name,cost:P[l.pid].cost||0,reason,at:TS});bt.update(fs.doc('products/'+l.pid),{stock:inc(l.v)})});
  aud(bt,'STOCK_COUNT','stockCounts',r.id,null,{adjusted:df.length},reason);
  if(await send(bt,'Na-post ang adjustments.',{col:'stockCounts',id:r.id,label:`Physical count · ${df.length} adjustments`}))go('prod');
}

async function runRep(){
  const f=$('#g_from').value,t=$('#g_to').value,q=n=>C(n).where('date','>=',f).where('date','<=',t).get();
  $('#rep').textContent='Loading…';
  try{
    const [s,r]=await Promise.all([q('sales'),q('returns')]);let rev=0,cogs=0,lost=0,bor=0;const col={Cash:0,Check:0,Charge:0};
    s.forEach(d=>{const x=d.data();if(x.rev)return;const c=x.lines.reduce((a,l)=>a+l.qty*l.cost,0);if(x.mode==='Lost')lost+=c;else if(x.mode==='Borrow')bor++;else{rev+=x.total;cogs+=c;col[x.mode]+=x.total}});
    let rr=0,rc=0;r.forEach(d=>{rr+=d.data().amount;rc+=d.data().cogs});
    const gp=rev-rr-(cogs-rc),row=(a,b,bold)=>`<tr><td>${bold?'<b>'+a+'</b>':a}<td class="r">${bold?'<b>'+b+'</b>':b}</tr>`;
    $('#rep').innerHTML=`<table>${row('Cash',peso(col.Cash))}${row('Check',peso(col.Check))}${row('Charge',peso(col.Charge))}${row('Gross sales',peso(rev))}${row('Less: returns',peso(rr))}${row('Net sales',peso(rev-rr))}${row('COGS (weighted avg cost snapshot, net of resalable returns)',peso(cogs-rc))}${row('Gross profit',peso(gp)+(rev-rr?' · '+(gp/(rev-rr)*100).toFixed(1)+'%':''),1)}${row('Inventory losses (Lost, at cost; hiwalay sa profit)',peso(lost))}${row('Borrow transactions (hindi sales)',bor)}</table><small style="color:var(--m)">Operational estimate: gumagamit ng cost snapshot sa oras ng benta. Mali ang cost kung may negative stock noon.</small>`;
  }catch(e){$('#rep').textContent='Error: '+e.message}
}
function ledger(){
  return `<h2>Stock Ledger <small>pinakabagong 200 · append-only</small></h2><div class="card w"><input id="q" placeholder="Search…" oninput="filt()" style="margin-bottom:8px"><table><thead><tr><th>Date<th>Item<th>Type<th class="r">Qty<th class="r">Cost<th>By<th>Reason</tr></thead><tbody id="tb">${D.map(m=>`<tr><td>${esc(m.date)}<td>${esc(P[m.pid]?.name)}<td>${m.type}${m._p?' <span class="tag">pending</span>':''}<td class="r">${m.qty}<td class="r">${peso(m.cost||0)}<td>${esc(m.byName)}<td>${esc(m.reason)}</tr>`).join('')}</tbody></table></div>`;

/* ---------- void (reversal), reconcile, conflicts, audit ---------- */
async function voidSale(id){
  const s=D.find(x=>x.id===id);
  if(s.paid>0||s.adj||Object.values(s.ret||{}).some(v=>v>0))return alert('Hindi pwedeng i-void: may bayad, return o sauli na.');
  const why=prompt(`I-void ang DR ${s.dr} (${peso(s.total)})? Reason (kailangan):`);if(!why)return;
  const bt=fs.batch(),date=today();
  s.lines.forEach(l=>{bt.set(nid('movements'),{pid:l.pid,qty:l.qty,type:'REVERSAL',ref:id,date,by:me.uid,byName:me.name,cost:l.cost,reason:why,at:TS});bt.update(fs.doc('products/'+l.pid),{stock:inc(l.qty)})});
  bt.update(fs.doc('sales/'+id),{rev:{by:me.uid,byName:me.name,reason:why,date},open:false,borrowOpen:false});
  aud(bt,'SALE_VOID','sales',id,{dr:s.dr,total:s.total},{voided:true},why);send(bt,'Na-void ang benta (nagawa ang reversal sa ledger).');
}
async function reconcile(){
  if(!navigator.onLine)return alert('Kailangan ng internet.');
  if(!confirm('Babasahin ang buong ledger (maraming reads sa Spark quota). Ituloy?'))return;
  try{
    const s=await C('movements').get({source:'server'}),sum={};s.forEach(d=>{const m=d.data();sum[m.pid]=(sum[m.pid]||0)+m.qty});
    const bad=ids().filter(i=>(sum[i]||0)!==stk(i));if(!bad.length)return alert('Tugma ang lahat ng stock sa ledger.');
    if(!confirm(bad.map(i=>`${P[i].name}: stock ${stk(i)}, ledger ${sum[i]||0}`).join('\n')+'\n\nI-set ang stock ayon sa ledger?'))return;
    const bt=fs.batch();bad.forEach(i=>{bt.update(fs.doc('products/'+i),{stock:sum[i]||0});aud(bt,'RECONCILE','products',i,{stock:stk(i)},{stock:sum[i]||0},'Ledger reconcile')});send(bt,'Na-reconcile.');
  }catch(e){alert(e.message)}
}
function conflicts(){
  const adm=me.role!=='encoder',l=D.slice().sort((a,b)=>(b.at?.seconds??9e9)-(a.at?.seconds??9e9));
  return `<h2>Sync Conflicts</h2><div class="card w"><p style="margin-top:0;color:var(--m)">Mga offline na transaksyon na hindi tinanggap ng server. Walang tahimik na pag-overwrite: i-review, i-re-enter nang tama, at i-resolve.</p><table><thead><tr><th>Date<th>Transaction<th>Reason<th>By<th>Status<th></tr></thead><tbody>${l.map(c=>`<tr><td>${fmt(c.at)}<td>${esc(c.label)}<td>${esc(c.error)}<td>${esc(c.byName)}<td><span class="tag ${c.status==='OPEN'?'no':'ok'}">${c.status}</span>${c.resolution?'<br><small>'+esc(c.resolution)+' — '+esc(c.reason)+' ('+esc(c.resolvedByName)+')</small>':''}<td>${c.kind==='sales'&&c.payload&&c.status==='OPEN'?`<button onclick="reenter('${c.id}')">Re-enter</button> `:''}${adm&&c.status==='OPEN'?`<button onclick="resolveC('${c.id}')">Resolve</button>`:''}</tr>`).join('')||'<tr><td colspan=6>Walang conflict.</tr>'}</tbody></table></div>`;
}
function reenter(id){
  const p=JSON.parse(D.find(x=>x.id===id).payload),ok=p.lines.filter(l=>P[l.pid]);if(ok.length<p.lines.length)alert('May product na wala na; hindi isasama.');
  openM('s');const m={s_date:'date',s_cust:'customer',s_acc:'account',s_mode:'mode',s_dr:'dr',s_po:'po',s_si:'si',s_notes:'notes'};
  Object.keys(m).forEach(k=>$('#'+k).value=p[m[k]]||'');
  R=blank(Math.max(10,ok.length)).map((r,i)=>ok[i]?{pid:ok[i].pid,qty:ok[i].qty,price:pe(ok[i].price),np:''}:r);drawRows();
}
function resolveC(id){
  const a=prompt('Resolution (hal. "Re-entered as new sale", "Rejected"):');if(!a)return;const r=prompt('Reason (kailangan):');if(!r)return;
  const bt=fs.batch();bt.update(fs.doc('syncConflicts/'+id),{status:'RESOLVED',resolution:a,reason:r,resolvedBy:me.uid,resolvedByName:me.name,resolvedAt:TS});
  aud(bt,'CONFLICT_RESOLVE','syncConflicts',id,{status:'OPEN'},{status:'RESOLVED',resolution:a},r);send(bt,'Resolved.');
}
function audit(){
  if(me.role==='encoder')return '<h2>Audit Log</h2><div class="card">Admin lang ang may access.</div>';
  return `<h2>Audit Log <small>pinakabagong 200</small></h2><div class="card w"><input id="q" placeholder="Search…" oninput="filt()" style="margin-bottom:8px"><table><thead><tr><th>Date<th>Who<th>Action<th>Record<th>Before → After<th>Reason</tr></thead><tbody id="tb">${D.map(a=>`<tr><td>${fmt(a.at)}<td>${esc(a.byName)} (${esc(a.role)})<td>${esc(a.action)}<td>${esc(a.entity)}/${esc(String(a.eid||'').slice(0,6))}<td><small>${esc(JSON.stringify(a.before))} → ${esc(JSON.stringify(a.after))}</small><td>${esc(a.reason)}</tr>`).join('')}</tbody></table></div>`;
}
function toggleU(u,v){const bt=fs.batch();bt.update(fs.doc('users/'+u),{active:v});aud(bt,v?'USER_ENABLE':'USER_DISABLE','users',u,{active:!v},{active:v},'');bt.commit().catch(x=>alert(x.message))}

/* ---------- product CSV template + import ---------- */
let IMP=[],IMPFN='';
const expTpl=()=>csv([['Name','SKU','Unit','Opening Stock','Cost','Price','Restock Level'],['Sample: Hammer 16oz (burahin ang row na ito)','HM-16','pc',24,150,225,5]],'product-template');
function csvParse(t){
  t=t.replace(/^\ufeff/,'');const rows=[];let r=[],c='',q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch==='"')q=true;
    else if(ch===','){r.push(c);c=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;r.push(c);c='';rows.push(r);r=[]}
    else c+=ch}
  if(c!==''||r.length){r.push(c);rows.push(r)}
  return rows.filter(x=>x.some(v=>v.trim()!==''));
}
function impFile(inp){const f=inp.files[0];if(!f)return;const fr=new FileReader();fr.onload=()=>{inp.value='';prepImport(csvParse(String(fr.result)),f.name)};fr.readAsText(f)}
function prepImport(rows,fn){
  const norm=s=>String(s).toLowerCase().replace(/[^a-z0-9]/g,''),al={name:'name',item:'name',itemname:'name',sku:'sku',code:'sku',productcode:'sku',unit:'unit',uom:'unit',openingstock:'stock',stock:'stock',cost:'cost',basecost:'cost',baseprice:'cost',price:'price',sellingprice:'price',restocklevel:'level',level:'level',reorderlevel:'level'};
  if(!rows.length)return alert('Walang laman ang file.');
  const h=rows[0].map(x=>al[norm(x)]||'');if(!h.includes('name'))return alert('Walang "Name" na column. I-download at gamitin ang template.');
  if(rows.length<2)return alert('Walang data rows.');
  const skus=new Set(Object.values(P).map(p=>(p.sku||'').toLowerCase()).filter(Boolean)),names=new Set(Object.values(P).map(p=>p.name.toLowerCase())),sS=new Set(),sN=new Set();
  const num=v=>{v=String(v??'').replace(/[₱,\s]/g,'');return v===''?0:Number(v)};
  IMP=rows.slice(1).map((r,i)=>{
    const o={line:i+2};h.forEach((k,j)=>{if(k)o[k]=(r[j]??'').trim()});
    o.name=o.name||'';o.sku=o.sku||'';o.unit=o.unit||'pc';o.stock=num(o.stock);o.cost=num(o.cost);o.price=num(o.price);o.level=num(o.level);
    const nl=o.name.toLowerCase(),sl=o.sku.toLowerCase();
    o.err=!o.name?'Walang name':[o.stock,o.level].some(v=>!Number.isInteger(v)||v<0)?'Stock/Level: buong numero ≥ 0':[o.cost,o.price].some(v=>!isFinite(v)||v<0)?'Invalid cost/price':sl&&(skus.has(sl)||sS.has(sl))?'Duplicate SKU':(names.has(nl)||sN.has(nl))?'Duplicate name':'';
    if(!o.err){if(sl)sS.add(sl);sN.add(nl)}return o});
  IMPFN=fn;K='i';const bad=IMP.filter(x=>x.err).length,ok=IMP.length-bad;
  $('#md').innerHTML=`<div class="mbox">${mh('s','IMPORT PRODUCTS')}<p>${esc(fn)} · <b>${ok}</b> valid, <b style="color:var(--r)">${bad}</b> may problema (hindi isasama)${IMP.length>500?' · unang 500 rows lang ang ipinapakita':''}</p>
  <div class="w" style="max-height:55vh;overflow:auto"><table><thead><tr><th>Row<th>Name<th>SKU<th>Unit<th class="r">Stock<th class="r">Cost<th class="r">Price<th class="r">Level<th>Status</tr></thead><tbody>${IMP.slice(0,500).map(x=>`<tr><td>${x.line}<td>${esc(x.name)}<td>${esc(x.sku)}<td>${esc(x.unit)}<td class="r">${isNaN(x.stock)?'?':x.stock}<td class="r">${isNaN(x.cost)?'?':x.cost.toFixed(2)}<td class="r">${isNaN(x.price)?'?':x.price.toFixed(2)}<td class="r">${isNaN(x.level)?'?':x.level}<td>${x.err?`<span class="tag no">${x.err}</span>`:'<span class="tag ok">OK</span>'}</tr>`).join('')}</tbody></table></div>
  <p><button onclick="closeM()">Cancel</button> <button class="p" id="ib" ${ok?'':'disabled'} onclick="doImport()">Import ${ok} product</button></p></div>`;
  $('#md').classList.add('on');
}
async function doImport(){
  const ok=IMP.filter(x=>!x.err);if(!ok.length)return;if(!confirm(`I-import ang ${ok.length} product?`))return;
  $('#ib').disabled=true;const date=today();let n=0;
  try{
    for(let i=0;i<ok.length;i+=100){
      const ch=ok.slice(i,i+100),bt=fs.batch();
      ch.forEach(x=>{
        const r=nid('products'),cost=toC(x.cost),price=toC(x.price);
        bt.set(r,{name:x.name,sku:x.sku,unit:x.unit,restock:x.level,price,cost,stock:x.stock,active:true,by:me.uid,at:TS});
        if(cost>0)bt.set(nid('priceHistory'),{pid:r.id,type:'COST',old:0,new:cost,src:'Import',by:me.uid,byName:me.name,at:TS});
        if(price>0)bt.set(nid('priceHistory'),{pid:r.id,type:'SELLING',old:0,new:price,src:'Import',by:me.uid,byName:me.name,at:TS});
        if(x.stock>0)bt.set(nid('movements'),{pid:r.id,qty:x.stock,type:'OPENING',ref:r.id,date,by:me.uid,byName:me.name,cost,at:TS});
      });
      aud(bt,'PRODUCT_IMPORT','products','batch',null,{count:ch.length},IMPFN);
      const p=bt.commit();if(navigator.onLine)await p;else p.catch(e=>alert('Na-reject ng server: '+e.message));
      n+=ch.length;
    }
    alert(navigator.onLine?`Na-import ang ${n} product.`:'Naka-save offline; pending sync.');closeM();
  }catch(e){alert(`Na-import ang ${n} product bago nag-error: ${e.message}. Buksan ulit ang import para sa natitira (mamarkahan na duplicate ang na-import na).`);closeM()}
}

async function addEnc(e){
  e.preventDefault();const f=e.target,name=$('#un').value.trim(),email=$('#ue').value.trim(),pw=$('#up').value,a=firebase.initializeApp(cfg,'x'+Date.now());
  try{const c=await a.auth().createUserWithEmailAndPassword(email,pw);await fs.doc('users/'+c.user.uid).set({name,email,role:'encoder',active:true,by:me.uid,at:TS});f.reset();alert('Encoder created.')}
  catch(x){alert('Failed: '+x.message)}finally{try{await a.auth().signOut()}catch(_){}a.delete()}
}
const approve=(uid,role)=>{const r=Q[uid],bt=fs.batch();bt.set(fs.doc('users/'+uid),{name:r.name||r.email,email:r.email,role,active:true,by:me.uid,at:TS});bt.delete(fs.doc('requests/'+uid));aud(bt,'USER_APPROVE','users',uid,null,{role},'');bt.commit().catch(x=>alert(x.message))};
