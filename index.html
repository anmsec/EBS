<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EBS Inventory System</title>
<style>
:root{--p:#6d4aff;--pl:#efeaff;--bg:#f5f5f8;--t:#1f2230;--m:#6b7080;--b:#e4e5ec;--g:#16a34a;--a:#d97706;--r:#dc2626}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;font:14px/1.45 system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--t)}
#app{display:flex;min-height:100vh}
aside{width:210px;background:#fff;border-right:1px solid var(--b);padding:16px 10px;flex:none}
aside h1{font-size:18px;margin:0 8px 16px;color:var(--p)}
nav a{display:block;padding:9px 12px;border-radius:8px;cursor:pointer;margin-bottom:2px}
nav a.on{background:var(--pl);color:var(--p);font-weight:600}
section{flex:1;min-width:0}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 24px;background:#fff;border-bottom:1px solid var(--b);gap:12px;flex-wrap:wrap}
#main{padding:24px}h2{margin:0 0 16px}h2 small{color:var(--m);font-weight:400;font-size:14px}
.card{background:#fff;border:1px solid var(--b);border-radius:12px;padding:16px;box-shadow:0 1px 2px #0001;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.grid .card{margin:0}.grid b{display:block;font-size:22px;margin-top:4px}.grid span{color:var(--m)}
table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid var(--b);text-align:left}
th{color:var(--m);font-size:12px}.r{text-align:right}.w{overflow-x:auto}
input,select,button{font:inherit;padding:8px 10px;border:1px solid var(--b);border-radius:8px;background:#fff;max-width:100%}
button{cursor:pointer}button.p{background:var(--p);color:#fff;border-color:var(--p)}button:disabled{opacity:.5}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.f label{display:flex;flex-direction:column;gap:4px;color:var(--m);font-size:12px}
.tag{padding:2px 8px;border-radius:99px;font-size:12px;background:#eee}
.ok{background:#dcfce7;color:var(--g)}.lo{background:#fef3c7;color:var(--a)}.no{background:#fee2e2;color:var(--r)}
#login{max-width:360px;margin:8vh auto;padding:0 16px}#login .card{display:flex;flex-direction:column;gap:10px}
#lerr{color:var(--r)}#print{display:none;padding:20px}
@media print{#app,#login{display:none!important}#print{display:block}}
@media(max-width:800px){#app{flex-direction:column}aside{width:auto;display:flex;flex-wrap:wrap;align-items:center;gap:6px}aside h1{margin:0}nav{display:flex;flex-wrap:wrap}#main{padding:12px}}
</style></head><body>
<div id="login" hidden><div class="card"><h1 style="margin:0;color:var(--p)">EBS Inventory</h1>
<button id="gbtn" class="p">Sign in with Google (Admin)</button><hr style="width:100%;border:0;border-top:1px solid var(--b)">
<form id="lform" style="display:flex;flex-direction:column;gap:10px"><input id="em" type="email" placeholder="Encoder email" required><input id="pw" type="password" placeholder="Password" required><button>Sign in (Encoder)</button></form>
<div id="lerr"></div></div></div>
<div id="app" hidden>
<aside><h1>EBS</h1><nav>
<a data-p="dash" onclick="go('dash')">Dashboard</a><a data-p="prod" onclick="go('prod')">Products</a>
<a data-p="sale" onclick="go('sale')">Sales Entry</a><a data-p="sales" onclick="go('sales')">Sales Records</a>
<a data-p="rest" onclick="go('rest')">Restock</a><a data-p="recv" onclick="go('recv')">Receivables</a><a data-p="borrow" onclick="go('borrow')">Borrowed</a><a id="nu" data-p="users" onclick="go('users')" hidden>Users</a></nav></aside>
<section><header><span id="net"></span><span><span id="who"></span> <button onclick="auth.signOut().then(()=>location.reload())">Sign out</button></span></header>
<div id="main"></div></section></div>
<div id="print"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const cfg={apiKey:"AIzaSyD8Vfw0CDKZ-r3JFzg44JNmkdzYqSG4_pk",authDomain:"tonstudio-8344c.firebaseapp.com",databaseURL:"https://tonstudio-8344c-default-rtdb.firebaseio.com",projectId:"tonstudio-8344c",storageBucket:"tonstudio-8344c.firebasestorage.app",messagingSenderId:"825040472434",appId:"1:825040472434:web:2757362c6761be5bdd35eb"};
firebase.initializeApp(cfg);
const auth=firebase.auth(),fs=firebase.firestore(),TS=firebase.firestore.FieldValue.serverTimestamp(),inc=firebase.firestore.FieldValue.increment;
fs.enablePersistence({synchronizeTabs:true}).catch(()=>{}); // offline cache + durable write queue (IndexedDB)
const $=s=>document.querySelector(s),C=n=>fs.collection(n),nid=n=>fs.collection(n).doc();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const peso=c=>'₱'+(c/100).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2});
const toC=v=>Math.round(parseFloat(v||0)*100),pe=c=>(c/100).toFixed(2);
const today=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Manila'});
const dk=s=>s.toUpperCase().replace(/[\/\s]/g,'_');
const MODES=['Cash','Check','Charge','Borrow','Lost'];
let me,P={},U={},Q={},D=[],cur='dash',started=false,R=[],unsub=null,PEND=0;
const stk=i=>P[i]?.stock||0;

/* ---------- auth ---------- */
const showLogin=()=>{$('#login').hidden=false;$('#app').hidden=true;$('#lerr').textContent=sessionStorage.m||'';sessionStorage.removeItem('m')};
const deny=m=>{sessionStorage.m=m;auth.signOut().then(()=>location.reload())};
$('#gbtn').onclick=()=>auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e=>$('#lerr').textContent=e.message);
$('#lform').onsubmit=e=>{e.preventDefault();auth.signInWithEmailAndPassword($('#em').value,$('#pw').value).catch(()=>$('#lerr').textContent='Invalid email or password.')};
auth.onAuthStateChanged(async u=>{
  if(!u)return showLogin();
  try{
    const s=await fs.doc('users/'+u.uid).get();
    if(s.exists){me={uid:u.uid,...s.data()};return me.active?start():deny('Naka-disable ang account na ito.')}
    const b=await fs.doc('meta/app').get();
    if(!b.exists){
      if(!confirm('Wala pang superadmin. Gawing superadmin ang account na ito?'))return deny('Cancelled.');
      const bt=fs.batch();bt.set(fs.doc('users/'+u.uid),{name:u.displayName||u.email,email:u.email||'',role:'superadmin',active:true,at:TS});bt.set(fs.doc('meta/app'),{bootstrapped:true});
      await bt.commit();return location.reload();
    }
    await fs.doc('requests/'+u.uid).set({email:u.email||'',name:u.displayName||'',at:TS});
    deny('Naipadala na ang access request. Hintayin ang approval ng superadmin.');
  }catch(e){deny('Error: '+e.message)}
});
function start(){
  $('#login').hidden=true;$('#app').hidden=false;$('#who').textContent=`${me.name} (${me.role})`;$('#nu').hidden=me.role!=='superadmin';
  if(started)return;started=true;
  C('products').onSnapshot(s=>{P={};s.forEach(d=>P[d.id]=d.data());soft()},()=>{});
  if(me.role==='superadmin'){C('users').onSnapshot(s=>{U={};s.forEach(d=>U[d.id]=d.data());soft()},()=>{});C('requests').onSnapshot(s=>{Q={};s.forEach(d=>Q[d.id]=d.data());soft()},()=>{})}
  net();go('dash');
}
const net=()=>{const e=$('#net'),o=navigator.onLine;e.textContent=(o?'● Online':'● Offline — naka-save locally, magsi-sync pag may internet')+(PEND?` · ${PEND} pending sync`:'');e.style.color=o?'var(--g)':'var(--r)'};
addEventListener('online',net);addEventListener('offline',net);
const soft=()=>{if(cur!=='sale'&&cur!=='rest')render()};

/* ---------- router + page-level queries (limits reads on Spark) ---------- */
const wk=()=>{const m=new Date(today()+'T00:00:00Z');m.setUTCDate(m.getUTCDate()-(m.getUTCDay()+6)%7);return[...Array(7)].map((_,i)=>new Date(m.getTime()+i*864e5).toISOString().slice(0,10))};
const LQ={dash:()=>{const w=wk();return C('sales').where('date','>=',w[0]).where('date','<=',w[6])},sales:()=>C('sales').orderBy('date','desc').limit(200),recv:()=>C('sales').where('open','==',true),borrow:()=>C('sales').where('borrowOpen','==',true)};
const pages={dash,prod,sale,sales,rest,users,recv,borrow};
function go(p){
  if(p==='users'&&me.role!=='superadmin')p='dash';
  cur=p;if(unsub){unsub();unsub=null}D=[];PEND=0;if(p==='sale'||p==='rest')R=[{pid:'',qty:1,price:''}];
  if(LQ[p])unsub=LQ[p]().onSnapshot({includeMetadataChanges:true},s=>{D=s.docs.map(d=>({id:d.id,...d.data(),_p:d.metadata.hasPendingWrites}));PEND=D.filter(x=>x._p).length;net();soft()},()=>{});
  document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.p===p));render();
}
const render=()=>{$('#main').innerHTML=pages[cur]();if(cur==='sale'||cur==='rest')drawRows()};
const ids=()=>Object.keys(P).sort((a,b)=>P[a].name.localeCompare(P[b].name));
const status=id=>{const s=stk(id);return s<0?['no','Negative']:s===0?['no','Out of stock']:s<=(P[id].restock||0)?['lo','Low stock']:['ok','In stock']};
const filt=()=>{const q=$('#q').value.toLowerCase();document.querySelectorAll('#tb tr').forEach(r=>r.hidden=!r.textContent.toLowerCase().includes(q))};
async function send(bt,ok){ // offline-safe commit: never claims "synced" before server confirms
  const p=bt.commit(),bad=e=>alert('Na-reject ng server: '+(e.code==='permission-denied'?'DR number ay ginamit na, o walang permiso.':e.message));
  if(!navigator.onLine){p.catch(bad);alert('Naka-save offline; pending sync.');return true}
  try{await p;alert(ok);return true}catch(e){bad(e);return false}
}

/* ---------- dashboard ---------- */
function dash(){
  const w=wk(),d=today(),sm=(dt,m)=>D.filter(s=>s.date===dt&&s.mode===m).reduce((a,s)=>a+s.total,0);
  const act=ids().filter(i=>P[i].active!==false),low=act.filter(i=>stk(i)<=(P[i].restock||0)),M3=['Cash','Check','Charge'],col=['#16a34a','#6d4aff','#d97706'];
  const c=[...M3.map(m=>[m,peso(sm(d,m))]),['Overall sales',peso(M3.reduce((a,m)=>a+sm(d,m),0))],['Borrow (count)',D.filter(s=>s.date===d&&s.mode==='Borrow').length],['Lost (count)',D.filter(s=>s.date===d&&s.mode==='Lost').length],['Items to restock',low.length],['Negative stock',act.filter(i=>stk(i)<0).length]];
  const by=w.map(x=>M3.map(m=>sm(x,m))),mx=Math.max(1,...by.flat());
  return `<h2>Dashboard <small>${d} · posted sale value; Lost/Borrow excluded</small></h2><div class="grid">${c.map(([k,v])=>`<div class="card"><span>${k}</span><b>${v}</b></div>`).join('')}</div>
  <div class="card"><h3 style="margin-top:0">This week <small style="color:var(--m);font-weight:400">${M3.map((m,k)=>`<span style="color:${col[k]}">■</span> ${m}`).join(' ')}</small></h3><div style="display:flex;gap:8px">${w.map((x,i)=>`<div style="flex:1;text-align:center"><div style="display:flex;gap:2px;align-items:flex-end;height:130px;justify-content:center">${by[i].map((v,k)=>`<div title="${M3[k]} ${peso(v)}" style="width:14px;height:${Math.round(v/mx*130)}px;background:${col[k]}"></div>`).join('')}</div><small>${x.slice(5)}</small></div>`).join('')}</div></div>
  <div class="card w"><h3 style="margin-top:0">Restock list</h3><table><tr><th>Item<th>Stock<th>Level<th>Status</tr>${low.map(i=>`<tr><td>${esc(P[i].name)}<td>${stk(i)}<td>${P[i].restock||0}<td><span class="tag ${status(i)[0]}">${status(i)[1]}</span></tr>`).join('')||'<tr><td colspan=4>Walang low stock.</tr>'}</table></div>`;
}

/* ---------- products ---------- */
function prod(){
  return `<h2>Products</h2><div class="card"><form class="f" onsubmit="addProd(event)">
  <label>Name<input id="pn" required></label><label>SKU<input id="ps"></label><label>Unit<input id="pu" value="pc"></label>
  <label>Opening stock<input id="po" type="number" min="0" step="1" value="0"></label><label>Cost ₱<input id="pc" type="number" min="0" step="0.01" value="0"></label>
  <label>Price ₱<input id="pp" type="number" min="0" step="0.01" value="0"></label><label>Restock level<input id="pr" type="number" min="0" step="1" value="0"></label>
  <label>&nbsp;<button class="p">Add product</button></label></form></div>
  <div class="card w"><input id="q" placeholder="Search…" oninput="filt()" style="margin-bottom:8px"> <button onclick="expStock()">Export CSV</button><table><thead><tr><th>Item<th>SKU<th>Unit<th class="r">Stock<th class="r">Level<th class="r">Avg cost<th class="r">Price<th>Status<th></tr></thead>
  <tbody id="tb">${ids().map(i=>{const p=P[i],s=status(i);return `<tr><td>${esc(p.name)}<td>${esc(p.sku)}<td>${esc(p.unit)}<td class="r">${stk(i)}<td class="r">${p.restock||0}<td class="r">${peso(p.cost||0)}<td class="r">${peso(p.price||0)}<td><span class="tag ${s[0]}">${s[1]}</span><td><button onclick="editPrice('${i}')">Edit price</button></tr>`}).join('')}</tbody></table></div>`;
}
async function addProd(e){
  e.preventDefault();const f=e.target,g=i=>$('#'+i).value.trim(),name=g('pn'),sku=g('ps'),all=Object.values(P);
  if(sku&&all.some(p=>(p.sku||'').toLowerCase()===sku.toLowerCase()))return alert('May product na gumagamit ng SKU na ito.');
  const d=all.find(p=>p.name.toLowerCase()===name.toLowerCase());
  if(d&&!confirm('May kapareho nang pangalan: '+d.name+'. Idagdag pa rin?'))return;
  const r=nid('products'),cost=toC(g('pc')),open=parseInt(g('po'))||0,bt=fs.batch();
  bt.set(r,{name,sku,unit:g('pu'),restock:parseInt(g('pr'))||0,price:toC(g('pp')),cost,stock:Math.max(0,open),active:true,by:me.uid,at:TS});
  if(open>0)bt.set(nid('movements'),{pid:r.id,qty:open,type:'OPENING',ref:r.id,date:today(),by:me.uid,cost,at:TS});
  if(await send(bt,'Na-add ang product.'))f.reset();
}
async function editPrice(id){
  const v=prompt('Bagong selling price ₱',pe(P[id].price));if(v===null)return;const n=toC(v);if(!(n>=0))return alert('Invalid price');
  const bt=fs.batch();bt.update(fs.doc('products/'+id),{price:n});bt.set(nid('priceHistory'),{pid:id,type:'SELLING',old:P[id].price,new:n,by:me.uid,at:TS});send(bt,'Updated.');
}

/* ---------- line editor ---------- */
const opts=v=>'<option value="">Select item</option>'+ids().filter(i=>P[i].active!==false).map(i=>`<option value="${i}" ${i===v?'selected':''}>${esc(P[i].name)}</option>`).join('');
function drawRows(){
  const s=cur==='sale';
  $('#rows').innerHTML=R.map((r,i)=>`<tr><td><select onchange="setR(${i},'pid',this.value)">${opts(r.pid)}</select>
  <td><input type="number" min="1" step="1" value="${r.qty}" style="width:80px" oninput="setR(${i},'qty',this.value)">
  <td><input type="number" min="0" step="0.01" value="${r.price}" style="width:110px" oninput="setR(${i},'price',this.value)">
  ${s?'':`<td><input type="number" min="0" step="0.01" value="${r.np||''}" style="width:110px" oninput="setR(${i},'np',this.value)">`}
  <td class="r" id="lt${i}">${peso(toC(r.price)*(parseInt(r.qty)||0))}${s?`<td>${r.pid?stk(r.pid):''}`:''}<td><button onclick="delR(${i})">✕</button></tr>`).join('');
  tot();
}
function tot(){
  let t=0;R.forEach((r,i)=>{const v=toC(r.price)*(parseInt(r.qty)||0);t+=v;const e=$('#lt'+i);if(e)e.textContent=peso(v)});
  if(cur==='rest')t+=toC($('#r_other').value)+toC($('#r_del').value);
  $('#tot').textContent=peso(t);
}
function setR(i,k,v){R[i][k]=v;if(k==='pid'){if(v)R[i].price=pe(cur==='sale'?P[v].price:P[v].cost);drawRows()}else tot()}
const addR=()=>{R.push({pid:'',qty:1,price:''});drawRows()};
const delR=i=>{R.splice(i,1);if(!R.length)R.push({pid:'',qty:1,price:''});drawRows()};

/* ---------- sales entry ---------- */
function sale(){
  return `<h2>Sales Entry</h2><div class="card"><div class="f">
  <label>Date<input id="s_date" type="date" value="${today()}"></label><label>Customer<input id="s_cust"></label><label>Account name<input id="s_acc"></label>
  <label>Payment<select id="s_mode">${MODES.map(m=>`<option>${m}</option>`).join('')}</select></label>
  <label>DR No. (manual)<input id="s_dr"></label><label>PO No.<input id="s_po"></label><label>SI No.<input id="s_si"></label></div>
  <div class="w"><table><thead><tr><th>Item<th>Qty<th>Price ₱<th class="r">Total<th>Stock<th></tr></thead><tbody id="rows"></tbody></table></div>
  <p><button onclick="addR()">+ Line</button></p><label style="color:var(--m);font-size:12px">Notes (required for Lost)<input id="s_notes" style="width:100%"></label>
  <h3>Total: <span id="tot">₱0.00</span></h3><button class="p" id="pb" onclick="postSale()">Post sale</button></div>`;
}
async function postSale(){
  const g=i=>$('#'+i).value.trim(),mode=g('s_mode'),dr=g('s_dr'),date=g('s_date')||today();
  const lines=R.filter(r=>r.pid).map(r=>({pid:r.pid,name:P[r.pid].name,qty:parseInt(r.qty),price:toC(r.price),cost:P[r.pid].cost||0}));
  if(!lines.length||lines.some(l=>!(l.qty>0)||!(l.price>=0)))return alert('Check items, qty at price.');
  if(new Set(lines.map(l=>l.pid)).size!==lines.length)return alert('May dobleng item. Pagsamahin sa isang line.');
  if(!g('s_cust'))return alert('Customer name ang kailangan.');
  if(mode!=='Lost'&&!dr)return alert('DR number ang kailangan.');
  if(mode==='Lost'&&!g('s_notes'))return alert('Reason sa Notes ang kailangan para sa Lost.');
  let negReason='';const neg=lines.filter(l=>l.qty>stk(l.pid));
  if(neg.length){negReason=prompt('Lalampas sa stock: '+neg.map(l=>l.name).join(', ')+'.\nReason para ituloy?')||'';if(!negReason)return}
  const total=lines.reduce((a,l)=>a+l.qty*l.price,0);
  if(!confirm(`I-post ang ${mode} na ${peso(total)}?`))return;
  const r=nid('sales'),type={Lost:'LOSS',Borrow:'BORROW_OUT'}[mode]||'SALE',bt=fs.batch(); // client-generated id = idempotent retry
  bt.set(r,{date,customer:g('s_cust'),account:g('s_acc'),mode,dr,po:g('s_po'),si:g('s_si'),notes:g('s_notes'),lines,total,negReason,paid:0,open:mode==='Charge',borrowOpen:mode==='Borrow',ret:{},by:me.uid,byName:me.name,at:TS});
  lines.forEach(l=>{bt.set(nid('movements'),{pid:l.pid,qty:-l.qty,type,ref:r.id,date,by:me.uid,cost:l.cost,at:TS});bt.update(fs.doc('products/'+l.pid),{stock:inc(-l.qty)})});
  if(dr)bt.set(fs.doc('drIndex/'+dk(dr)),{sale:r.id});
  $('#pb').disabled=true;
  if(await send(bt,'Na-post.'))go('sales');else $('#pb').disabled=false;
}

/* ---------- sales records + print ---------- */
function sales(){
  return `<h2>Sales Records <small>pinakabagong 200</small></h2><div class="card w"><input id="q" placeholder="Search DR / customer / PO / SI" oninput="filt()" style="margin-bottom:8px"> <button onclick="expSales()">Export CSV</button>
  <table><thead><tr><th>Date<th>DR<th>Customer<th>PO<th>SI<th>Mode<th class="r">Total<th>By<th></tr></thead><tbody id="tb">
  ${D.map(s=>`<tr><td>${esc(s.date)}<td>${esc(s.dr)}<td>${esc(s.customer)}<td>${esc(s.po)}<td>${esc(s.si)}<td>${s.mode}${s.negReason?' <span class="tag lo" title="'+esc(s.negReason)+'">neg stock</span>':''}${s._p?' <span class="tag">pending sync</span>':''}<td class="r">${peso(s.total)}<td>${esc(s.byName)}<td><button onclick="printDR('${s.id}')">Print</button></tr>`).join('')}</tbody></table></div>`;
}
function printDR(id){
  const s=D.find(x=>x.id===id);
  $('#print').innerHTML=`<h2>EBS — Delivery Receipt</h2><p>DR No: <b>${esc(s.dr)}</b> &nbsp; Date: ${esc(s.date)}<br>Customer: ${esc(s.customer)} ${esc(s.account)}<br>PO: ${esc(s.po)} &nbsp; SI: ${esc(s.si)} &nbsp; Payment: ${s.mode}</p>
  <table><tr><th>Item<th>Qty<th class="r">Price<th class="r">Total</tr>${s.lines.map(l=>`<tr><td>${esc(l.name)}<td>${l.qty}<td class="r">${peso(l.price)}<td class="r">${peso(l.qty*l.price)}</tr>`).join('')}</table>
  <h3 style="text-align:right">Total ${peso(s.total)}</h3><p>Prepared by: ${esc(s.byName)}</p><p style="margin-top:50px">Received by: ____________________</p>`;
  window.print();
}

/* ---------- restock ---------- */
function rest(){
  return `<h2>Restock Entry</h2><div class="card"><div class="f"><label>Date<input id="r_date" type="date" value="${today()}"></label><label>Supplier<input id="r_sup"></label><label>Supplier ref / invoice<input id="r_ref"></label></div>
  <div class="w"><table><thead><tr><th>Item<th>Qty<th>Unit cost ₱<th>New selling price ₱<th class="r">Total<th></tr></thead><tbody id="rows"></tbody></table></div>
  <p><button onclick="addR()">+ Line</button></p><div class="f"><label>Other charges ₱<input id="r_other" type="number" min="0" step="0.01" value="0" oninput="tot()"></label><label>Delivery charges ₱<input id="r_del" type="number" min="0" step="0.01" value="0" oninput="tot()"></label><label>Notes<input id="r_notes"></label></div>
  <h3>Total: <span id="tot">₱0.00</span></h3><button class="p" id="pb" onclick="postRest()">Post restock</button></div>`;
}
async function postRest(){
  const g=i=>$('#'+i).value.trim(),date=g('r_date')||today();
  const lines=R.filter(r=>r.pid).map(r=>({pid:r.pid,name:P[r.pid].name,qty:parseInt(r.qty),cost:toC(r.price),np:r.np?toC(r.np):null}));
  if(!lines.length||lines.some(l=>!(l.qty>0)||!(l.cost>=0)||(l.np!==null&&!(l.np>=0))))return alert('Check items, qty at cost.');
  if(new Set(lines.map(l=>l.pid)).size!==lines.length)return alert('May dobleng item. Pagsamahin sa isang line.');
  if(!g('r_sup'))return alert('Supplier ang kailangan.');
  const other=toC(g('r_other')),del=toC(g('r_del')),charges=other+del,sub=lines.reduce((a,l)=>a+l.qty*l.cost,0),total=sub+charges;
  if(!(charges>=0))return alert('Invalid charges.');
  let left=charges;lines.forEach((l,i)=>{l.alloc=i===lines.length-1?left:(sub?Math.round(charges*l.qty*l.cost/sub):0);left-=l.alloc});
  if(!confirm(`I-post ang restock na ${peso(total)}?`))return;
  const r=nid('restocks'),bt=fs.batch();
  lines.forEach(l=>{
    const landed=l.qty*l.cost+l.alloc,have=Math.max(0,stk(l.pid)),avg=Math.round((have*(P[l.pid].cost||0)+landed)/(have+l.qty));l.landedUnit=Math.round(landed/l.qty);
    bt.set(nid('movements'),{pid:l.pid,qty:l.qty,type:'RESTOCK',ref:r.id,date,by:me.uid,cost:l.landedUnit,at:TS});
    const up={cost:avg,stock:inc(l.qty)};if(l.np!==null)up.price=l.np;bt.update(fs.doc('products/'+l.pid),up);
    bt.set(nid('priceHistory'),{pid:l.pid,type:'COST',old:P[l.pid].cost||0,new:avg,by:me.uid,ref:r.id,at:TS});
    if(l.np!==null)bt.set(nid('priceHistory'),{pid:l.pid,type:'SELLING',old:P[l.pid].price||0,new:l.np,by:me.uid,ref:r.id,at:TS});
  });
  bt.set(r,{date,supplier:g('r_sup'),ref:g('r_ref'),notes:g('r_notes'),lines,subtotal:sub,other,delivery:del,total,by:me.uid,byName:me.name,at:TS});
  $('#pb').disabled=true;
  if(await send(bt,'Na-post ang restock.'))go('prod');else $('#pb').disabled=false;
}

/* ---------- receivables / borrowed / csv ---------- */
function recv(){
  const tb=D.reduce((a,s)=>a+s.total-s.paid,0);
  return `<h2>Receivables <small>Open balance ${peso(tb)} (mga hindi pa bayad lang)</small></h2><div class="card w"><input id="q" placeholder="Search…" oninput="filt()" style="margin-bottom:8px"><table><thead><tr><th>Date<th>DR<th>Customer<th class="r">Amount<th class="r">Paid<th class="r">Balance<th>Status<th></tr></thead><tbody id="tb">${D.map(s=>`<tr><td>${esc(s.date)}<td>${esc(s.dr)}<td>${esc(s.customer)}<td class="r">${peso(s.total)}<td class="r">${peso(s.paid)}<td class="r">${peso(s.total-s.paid)}<td><span class="tag ${s.paid?'lo':'no'}">${s.paid?'Partial':'Unpaid'}</span>${s._p?' <span class="tag">pending</span>':''}<td><button onclick="pay('${s.id}')">Record payment</button> <button onclick="hist('${s.id}')">History</button></tr>`).join('')}</tbody></table></div>`;
}
async function pay(id){
  const s=D.find(x=>x.id===id),b=s.total-s.paid,v=prompt(`Payment amount ₱ (balance ${peso(b)})`);if(v===null)return;
  const a=toC(v);if(!(a>0)||a>b)return alert('Invalid amount o lampas sa balance.');
  const m=prompt('Method (Cash/Check/Bank/GCash)','Cash')||'Cash',ref=prompt('Reference / OR no. (optional)')||'',bt=fs.batch();
  bt.set(nid('payments'),{sale:id,customer:s.customer,amount:a,method:m,ref,date:today(),by:me.uid,byName:me.name,at:TS});
  bt.update(fs.doc('sales/'+id),{paid:inc(a),open:a<b});send(bt,'Na-record ang bayad.');
}
async function hist(id){const s=await C('payments').where('sale','==',id).get();alert(s.docs.map(d=>d.data()).sort((x,y)=>x.date<y.date?-1:1).map(p=>`${p.date}  ${peso(p.amount)}  ${p.method} ${p.ref||''}  (${p.byName})`).join('\n')||'Wala pang bayad.')}
function borrow(){
  const rows=[];D.slice().sort((a,b)=>a.date<b.date?1:-1).forEach(s=>s.lines.forEach(l=>rows.push([s,l,(s.ret||{})[l.pid]||0])));
  return `<h2>Borrowed Items <small>mga bukas pa lang</small></h2><div class="card w"><input id="q" placeholder="Search…" oninput="filt()" style="margin-bottom:8px"><table><thead><tr><th>Date<th>DR<th>Borrower<th>Item<th class="r">Borrowed<th class="r">Returned<th class="r">Outstanding<th></tr></thead><tbody id="tb">${rows.map(([s,l,r])=>`<tr><td>${esc(s.date)}<td>${esc(s.dr)}<td>${esc(s.customer)}<td>${esc(l.name)}<td class="r">${l.qty}<td class="r">${r}<td class="r">${l.qty-r}<td>${l.qty-r>0?`<button onclick="retB('${s.id}','${l.pid}')">Return</button>`:'<span class="tag ok">Returned</span>'}</tr>`).join('')}</tbody></table></div>`;
}
async function retB(sid,pid){
  const s=D.find(x=>x.id===sid),l=s.lines.find(x=>x.pid===pid),out=l.qty-((s.ret||{})[pid]||0),v=parseInt(prompt(`Ilan ang isinauli? (outstanding ${out})`));
  if(!(v>0)||v>out)return alert('Invalid qty.');
  const date=today(),left=s.lines.reduce((a,x)=>a+x.qty-((s.ret||{})[x.pid]||0),0)-v,bt=fs.batch();
  bt.set(nid('borrowReturns'),{sale:sid,pid,qty:v,date,by:me.uid,byName:me.name,at:TS});
  bt.set(nid('movements'),{pid,qty:v,type:'BORROW_RETURN',ref:sid,date,by:me.uid,cost:l.cost,at:TS});
  bt.update(fs.doc('products/'+pid),{stock:inc(v)});bt.update(fs.doc('sales/'+sid),{['ret.'+pid]:inc(v),borrowOpen:left>0});send(bt,'Na-record ang sauli.');
}
function csv(rows,name){
  const t='\ufeff'+rows.map(r=>r.map(c=>{if(typeof c!=='number'){c=String(c??'');if(/^[=+\-@]/.test(c))c="'"+c}c=String(c);return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c}).join(',')).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv;charset=utf-8'}));a.download=name+'-'+today()+'.csv';a.click();
}
const expSales=()=>csv([['Date','DR','PO','SI','Customer','Account','Mode','Total','Paid (Charge)','Neg-stock reason','By']].concat(D.map(s=>[s.date,s.dr,s.po,s.si,s.customer,s.account,s.mode,pe(s.total),s.mode==='Charge'?pe(s.paid):'',s.negReason,s.byName])),'sales');
const expStock=()=>csv([['Item','SKU','Unit','Stock','Restock level','Avg cost','Price','Stock value','Status']].concat(ids().map(i=>{const p=P[i];return [p.name,p.sku,p.unit,stk(i),p.restock||0,pe(p.cost||0),pe(p.price||0),pe(stk(i)*(p.cost||0)),status(i)[1]]})),'stock');

/* ---------- users (superadmin) ---------- */
function users(){
  const rq=Object.keys(Q);
  return `<h2>Users</h2><div class="card"><h3 style="margin-top:0">Add encoder</h3><form class="f" onsubmit="addEnc(event)"><label>Name<input id="un" required></label><label>Email<input id="ue" type="email" required></label><label>Password (min 6)<input id="up" type="password" minlength="6" required></label><label>&nbsp;<button class="p">Create encoder</button></label></form></div>
  ${rq.length?`<div class="card w"><h3 style="margin-top:0">Access requests (Google sign-in)</h3><table>${rq.map(u=>`<tr><td>${esc(Q[u].name)}<td>${esc(Q[u].email)}<td><button onclick="approve('${u}','admin')">Approve as admin</button> <button onclick="approve('${u}','encoder')">as encoder</button></tr>`).join('')}</table></div>`:''}
  <div class="card w"><table><tr><th>Name<th>Email<th>Role<th>Active</tr>${Object.keys(U).map(u=>`<tr><td>${esc(U[u].name)}<td>${esc(U[u].email)}<td>${U[u].role}<td>${u===me.uid?'—':`<input type="checkbox" ${U[u].active?'checked':''} onchange="fs.doc('users/${u}').update({active:this.checked})">`}</tr>`).join('')}</table></div>`;
}
async function addEnc(e){
  e.preventDefault();const f=e.target,name=$('#un').value.trim(),email=$('#ue').value.trim(),pw=$('#up').value,a=firebase.initializeApp(cfg,'x'+Date.now());
  try{const c=await a.auth().createUserWithEmailAndPassword(email,pw);await fs.doc('users/'+c.user.uid).set({name,email,role:'encoder',active:true,by:me.uid,at:TS});f.reset();alert('Encoder created.')}
  catch(x){alert('Failed: '+x.message)}finally{try{await a.auth().signOut()}catch(_){}a.delete()}
}
const approve=(uid,role)=>{const r=Q[uid],bt=fs.batch();bt.set(fs.doc('users/'+uid),{name:r.name||r.email,email:r.email,role,active:true,by:me.uid,at:TS});bt.delete(fs.doc('requests/'+uid));bt.commit().catch(x=>alert(x.message))};
</script></body></html>
